{% extends "base.html" %}{% block title %}Add supplier{% endblock %}{% block page_heading %}Add supplier{% endblock %}
{% block content %}<p class="muted form-intro">Save a contact for a distributor or supplier.</p><form method="post" class="panel form-panel"><div class="form-grid"><label>Supplier name <span>*</span><input name="name" required placeholder="e.g. City Wholesale Traders"></label><label>Phone<input name="phone" placeholder="Phone number"></label><label>Email<input type="email" name="email" placeholder="supplier@example.com"></label><label class="full-field">Address<textarea name="address" rows="3" placeholder="Business address"></textarea></label></div><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('suppliers') }}">Cancel</a><button class="btn btn-primary">Save supplier</button></div></form>{% endblock %}
